<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7f5" />
    <title>中药饮片报价系统 · 小程序原型</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="prototype-stage">
      <aside class="scenario-rail" aria-label="原型场景切换">
        <div class="prototype-brand">
          <span class="brand-mark">饮</span>
          <div>
            <strong>中药饮片报价</strong>
            <small>PRD v2.1 · 可点击原型</small>
          </div>
        </div>

        <div class="scenario-group">
          <span class="scenario-label">体验场景</span>
          <button class="scenario-button active" data-role="sales">
            <span class="scenario-icon">销</span>
            <span><strong>销售员小程序</strong><small>采购、询价、计价、导出</small></span>
          </button>
          <button class="scenario-button" data-role="hospital">
            <span class="scenario-icon">院</span>
            <span><strong>医院轻量端</strong><small>提交和查看采购单状态</small></span>
          </button>
          <button class="scenario-button" data-role="supplier">
            <span class="scenario-icon">厂</span>
            <span><strong>厂家报价 H5</strong><small>凭链接填写本次报价</small></span>
          </button>
        </div>

        <div class="scenario-note">
          <span class="status-dot"></span>
          当前演示数据保存在本页，刷新后重置。
        </div>
      </aside>

      <main class="device-shell" aria-label="中药饮片报价系统原型">
        <div class="device-statusbar" aria-hidden="true">
          <span>09:41</span>
          <span>5G&nbsp;&nbsp;●●●</span>
        </div>
        <div id="app" class="app-root"></div>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <div id="modal" class="modal-layer hidden" role="dialog" aria-modal="true">
      <div class="modal-sheet">
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
