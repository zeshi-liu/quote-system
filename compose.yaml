services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: quote_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: quote_system
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - quote_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quote_user -d quote_system']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  quote_pg:
