name: Core trial verification
on:
  push:
    branches: [main, codex/mini-core-trial, codex/quote-delivery]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: core-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: quote_core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d quote_core_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - run: pnpm test
        env:
          EXPORT_FONT_PATH: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          EXPORT_FONT_FAMILY: NotoSansCJKsc-Regular
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/quote_core_test
      - run: pnpm typecheck
      - run: pnpm test:ui
      - run: pnpm build
